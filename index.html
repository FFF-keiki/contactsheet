<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7f9" />
  <meta name="description" content="元画像を圧縮せず、大きく比較できるコンタクトシートをブラウザで作成してPNGで保存します。" />
  <title>FRAME / MAKER — コンタクトシート作成</title>
  <link rel="stylesheet" href="./styles.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-symbol" aria-hidden="true">▧</span><strong>FRAME <span class="slash">/</span> MAKER</strong></div>
      <div class="topbar-right"><span class="local-pill">画像はブラウザ内のみで処理</span><button id="exportPngBtn" class="button primary" type="button">シートをPNG保存 ↓</button></div>
    </header>
    <div class="workspace">
      <aside class="editor-panel">
        <div class="panel-head"><div><span class="section-kicker">EDITOR</span><h1>シート編集</h1></div><button id="resetBtn" class="text-action" title="すべての入力内容を消去" type="button">新規作成</button></div>
        <section class="side-section">
          <label class="field">出力レイアウト
            <select id="sheetColumns"><option value="1">1列（画像を大きく）</option><option value="2">2列（コンパクト）</option></select>
          </label>
          <p class="hint">印刷画像にはタイトルやフッターを表示しません。元画像は縮小・圧縮せず読み込みます。</p>
        </section>
        <section class="side-section cards-section" aria-labelledby="boxTitle">
          <div class="side-heading-row"><h2 id="boxTitle" class="side-heading">ボックス <span id="boxCount" class="count">1</span></h2><button id="addBoxBtn" class="mini-add" type="button">＋ 追加</button></div>
          <div id="boxList" class="box-list" role="list" aria-label="ボックス一覧・並び順"></div>
          <p class="hint compact">↑↓で順番を変更できます。</p>
        </section>
        <section class="side-section detail-section" aria-labelledby="detailTitle">
          <div class="side-heading-row"><h2 id="detailTitle" class="side-heading">選択中のボックス</h2><button id="downloadBoxBtn" type="button" class="text-action">個別PNG ↓</button></div>
          <div id="boxEditor"></div>
        </section>
        <div class="panel-bottom"><button id="loadDemoBtn" class="demo-link" type="button">サンプルを読み込む ↗</button><p>画像はサーバーに送信されません。JSON保存もありません。ページを閉じると入力内容は消えます。</p></div>
      </aside>
      <main class="main-area">
        <div class="preview-top"><div><span class="section-kicker">LIVE PREVIEW</span><h2>画像プレビュー</h2></div><div class="preview-meta"><span id="status" role="status">準備完了</span><span>PNG・元画像の解像度を優先</span></div></div>
        <div class="preview-scroll" id="previewScroll">
          <div class="sheet" id="sheetPreview">
            <div id="sheetGrid" class="sheet-grid columns-1"></div>
          </div>
        </div>
        <p class="workspace-footnote">プレビューの画像は表示幅に合わせています。PNG保存時は元画像の画素数を確保し、出力可能な上限を超える場合は縮小せずエラーを表示します。</p>
      </main>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
