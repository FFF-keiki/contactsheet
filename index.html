<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>FRAME / MAKER — コンタクトシート作成</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="編集パネル">
      <div class="sidebar-heading">
        <div class="eyebrow">FRAME / MAKER</div>
        <h1>コンタクトシート作成</h1>
        <p>画像は端末内で処理され、サーバーに送信されません。</p>
      </div>

      <div class="sidebar-scroll" id="sidebarScroll">
        <section class="sidebar-section">
          <div class="section-head">
            <div class="section-title">ボックス <span class="count" id="boxCount">1</span></div>
            <button type="button" class="btn btn-outline btn-small" id="addBox">＋ 追加</button>
          </div>
          <div class="box-list" id="boxList"></div>
          <div class="hint">↑ ↓ で順番変更 ／ 不要なボックスは削除できます</div>
        </section>

        <section class="sidebar-section">
          <div class="section-head"><div class="section-title">カスタムモデル名</div></div>
          <div class="model-create-row">
            <input type="text" id="modelNameInput" placeholder="例：Line Art Model v3" maxlength="80" aria-label="モデル名を追加">
            <button type="button" class="btn btn-outline btn-small" id="addModel">追加</button>
          </div>
          <div class="hint">登録したモデル名を各ボックスで選択できます。ページを閉じると消えます。</div>
        </section>

        <div id="boxEditor"></div>
      </div>

      <div class="sidebar-bottom">
        <button type="button" class="btn btn-primary" id="downloadSheet">シート全体をPNG保存 <span aria-hidden="true">↗</span></button>
        <button type="button" class="btn btn-secondary" id="downloadBox">選択ボックスをPNG保存</button>
        <p id="status" class="status" role="status" aria-live="polite">画像は縮小・圧縮せずに読み込みます。</p>
      </div>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <div>
          <div class="eyebrow accent">LIVE PREVIEW</div>
          <h2>画像プレビュー</h2>
        </div>
        <div class="workspace-note">理想・素材・結果を各1枚ずつ表示<br>比較したい数だけボックスを追加して縦に並べます</div>
      </header>
      <div class="preview-scroll" id="previewScroll">
        <div class="preview-stage">
          <div id="captureSurface" class="capture-surface" aria-label="PNG出力対象"></div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.min.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
